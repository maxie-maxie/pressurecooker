name: publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Check package metadata
        run: python -m twine check --strict dist/*
      - name: Install the wheel
        run: python -m pip install dist/*.whl
      - name: Check the release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from pressurecooker import __version__

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if version != __version__:
              raise SystemExit(f"Package version {version} differs from CLI version {__version__}")
          tag = os.environ["RELEASE_TAG"]
          if os.environ["GITHUB_EVENT_NAME"] == "release" and tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} must be v{version}")
          print(f"Checked pressurecooker-video {version}")
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check the installed command
        run: pressurecooker --version
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pressurecooker-video
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
