name: build-binaries

# Build static release binaries manually and attach artifacts for review.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version string embedded via -X main.version
        required: false
        default: "2.0.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build all targets and check Linux binaries
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || '2.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet and test
        run: |
          go vet ./...
          go test -v -count=1 ./...
      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/pressurecooker-windows-amd64.exe ./cmd/pressurecooker
          CGO_ENABLED=0 GOOS=windows GOARCH=386   go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/pressurecooker-windows-386.exe   ./cmd/pressurecooker
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/pressurecooker-linux-amd64       ./cmd/pressurecooker
          CGO_ENABLED=0 GOOS=linux   GOARCH=386   go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/pressurecooker-linux-386         ./cmd/pressurecooker
          ls -lh dist/
      - name: Smoke check Linux binaries
        run: |
          set -euo pipefail
          for bin in dist/pressurecooker-linux-amd64 dist/pressurecooker-linux-386; do
            out="$("./$bin" --version)"
            echo "$bin: $out"
            test "$out" = "pressurecooker ${VERSION}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pressurecooker-binaries
          path: |
            dist/pressurecooker-windows-amd64.exe
            dist/pressurecooker-windows-386.exe
            dist/pressurecooker-linux-amd64
            dist/pressurecooker-linux-386
          if-no-files-found: error

  smoke-windows:
    name: Smoke check Windows binaries
    needs: build
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version || '2.0.0' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pressurecooker-binaries
          path: dist
      - name: Smoke check Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($bin in @('dist/pressurecooker-windows-amd64.exe', 'dist/pressurecooker-windows-386.exe')) {
            $out = (& $bin --version).Trim()
            Write-Host "${bin}: $out"
            if ($out -ne "pressurecooker $($env:VERSION)") {
              throw "Unexpected version from ${bin}: $out"
            }
          }
