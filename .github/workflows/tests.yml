name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Run tests
        run: go test -v -count=1 ./...
      - name: Verify cross-builds
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$(mktemp -d)"
          trap 'rm -rf "$out_dir"' EXIT
          for target in windows/amd64 windows/386 linux/amd64 linux/386; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "$out_dir/pressurecooker-${os}-${arch}${ext}" ./cmd/pressurecooker
          done
